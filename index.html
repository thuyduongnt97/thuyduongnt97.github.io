<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trang cá nhân của Thuỳ Dương</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #f4f6f8;
      color: #333;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: #ffffff;
      max-width: 500px;
      width: 100%;
      border-radius: 16px;
      padding: 36px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
      text-align: center;
    }
    .avatar {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      background: #2563eb;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      font-weight: bold;
      margin: 0 auto 20px;
    }
    h1 {
      font-size: 24px;
      margin-bottom: 8px;
      color: #111827;
    }
    p.subtitle {
      color: #6b7280;
      font-size: 15px;
      margin-bottom: 24px;
    }
    p.bio {
      font-size: 15px;
      line-height: 1.6;
      color: #4b5563;
      margin-bottom: 28px;
    }
    .links {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .btn {
      display: block;
      padding: 12px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 500;
      font-size: 15px;
      transition: all 0.2s ease;
    }
    .btn-primary {
      background: #2563eb;
      color: white;
    }
    .btn-primary:hover {
      background: #1d4ed8;
    }
    .btn-secondary {
      background: #f3f4f6;
      color: #374151;
    }
    .btn-secondary:hover {
      background: #e5e7eb;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="avatar">D</div>
    <h1>Chào, mình là Dương!</h1>
    <p class="subtitle">Welcome to my personal site</p>
    <p class="bio">
      Đây là trang web cá nhân đầu tiên được lưu trữ miễn phí thông qua GitHub Pages. Bạn có thể chỉnh sửa thông tin giới thiệu, liên kết mạng xã hội hoặc dự án cá nhân tại đây.
    </p>

    <div class="links">
      <a href="https://github.com/thuyduongnt97" target="_blank" class="btn btn-primary">Ghé thăm GitHub Profile</a>
      <a href="mailto:example@gmail.com" class="btn btn-secondary">Gửi Email liên hệ</a>
    </div>
  </div>

</body>
</html>
