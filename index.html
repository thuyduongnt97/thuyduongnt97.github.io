<!DOCTYPE html>
<html lang="vi" data-theme="light">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Title, SEO và JSON-LD được sinh từ src/data/profile.js bởi Vite. -->
  <meta name="theme-color" content="#f8fafc">

  <link rel="icon" type="image/svg+xml" href="/favicon.svg">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;600;700&display=swap"
    rel="stylesheet">

  <!-- Theme + JS flag set early to avoid flash -->
  <script>
    (function () {
      var d = document.documentElement;
      d.classList.add('js');
      var t;
      try { t = localStorage.getItem('theme'); } catch (e) { }
      if (t !== 'light' && t !== 'dark') t = 'light';
      d.setAttribute('data-theme', t);
      d.querySelector('meta[name="theme-color"]').setAttribute('content', t === 'light' ? '#f8fafc' : '#15181e');
    })();
  </script>

</head>

<body>
  <div id="app"></div>
  <noscript>Trang này cần bật JavaScript để hiển thị. Bạn có thể xem CV tại <a href="/Thuy-Duong-CV.pdf">Thuy-Duong-CV.pdf</a>.</noscript>
  <script type="module" src="/src/main.js"></script>
</body>

</html>
